# D17-PINN重构 smoke config
# This file is intentionally no-state-label. State soft labels are frozen-audit only.

d17_protocol_version: 1
experiment_name: d17_pinn_rebuild_smoke
mode: voltage_informed_inverse_pinn
seed: 20260615

paths:
  split_manifest: "E:/XJTU battery dataset/_gv1_cache/xjtu_d17_pinn_rebuild/split/d17_split_manifest.json"
  resolved_spec: "configs/resolved_p2dlite_spec_placeholder.json"
  output_root: "E:/XJTU battery dataset/_gv1_cache/xjtu_d17_pinn_rebuild"

train:
  split: train
  allowed_profile_fields: [t_global_s, I_profile, voltage_exp, temperature_C, cycle_id, step_id, step_type, protocol, batch, cell_uid]
  forbidden_state_fields: [cs_a, cs_c, theta_a, theta_c, phie, phis_c, phie_soft, phis_c_soft, theta0_oracle, oracle_shift]
  allow_softlabel_npz_profile_source: false
  time_window_s: 40000
  max_time_points: 4096
  n_r: 17

losses:
  voltage: true
  cbar_current: true
  diffusion_pde: true
  surface_flux: true
  zero_mean_delta: true
  ocp_bv_closure: true
  gauge: true
  prior_z: true
  preservation: true
  secondary_conservation: true

  # Mainline forbidden losses. These must remain false.
  state_supervised: false
  softlabel_supervised: false
  cs_soft: false
  theta_soft: false
  phie_soft: false
  phis_c_soft: false

checkpoint_selection:
  use_voltage_metrics: true
  use_physics_metrics: true
  use_no_drift_metrics: true
  use_state_softlabel_metrics: false
  use_frozen_test_metrics: false

audit:
  no_state_label_training: true
  split_manifest_locked: true
  no_oracle_theta0: true
  no_test_feedback: true
  battery8_policy: flagged_probe
