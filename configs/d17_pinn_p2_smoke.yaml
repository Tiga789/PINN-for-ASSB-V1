# D17-P2 smoke config: mechanism-heavy, observed-only forward/backward.
# Mainline still forbids cs/theta/phie/phis soft-label supervision.

d17_protocol_version: 2
experiment_name: d17_p2_forward_backward_smoke
mode: voltage_informed_generator_choice_replication_pinn
seed: 20260615

paths:
  split_manifest: "E:/XJTU battery dataset/_gv1_cache/xjtu_d17_pinn_rebuild/split/d17_split_manifest.json"
  resolved_spec: "configs/resolved_p2dlite_spec_placeholder.json"
  output_root: "E:/XJTU battery dataset/_gv1_cache/xjtu_d17_pinn_rebuild"

train:
  split: train
  profile_index: 0
  time_window_s: 40000
  max_time_points: 512
  n_r: 17
  epochs: 15
  lr: 0.001
  weight_decay: 0.0
  device: auto
  gradient_clip_norm: 10.0
  allow_softlabel_npz_profile_source: false

model:
  hidden_dim: 32
  latent_hidden_dim: 32
  delta_layers: 3
  delta_amp_fraction: 0.018
  enable_low_transition_residual: false
  low_residual_amp_V: 0.030
  use_observed_voltage_in_encoder: true
  use_observed_voltage_for_gate: true

loss_weights:
  voltage: 1.0
  diffusion_pde: 0.000002
  surface_flux: 0.002
  cbar_inventory: 0.001
  zero_mean_delta: 1.0
  ocp_bv_closure: 0.0001
  gauge_smooth: 0.0001
  prior_z: 0.001
  residual_preservation: 0.001

losses:
  voltage: true
  cbar_current: true
  diffusion_pde: true
  surface_flux: true
  zero_mean_delta: true
  ocp_bv_closure: true
  gauge: true
  prior_z: true
  preservation: true
  secondary_conservation: true

  # Mainline forbidden losses. Must remain false.
  state_supervised: false
  softlabel_supervised: false
  cs_soft: false
  theta_soft: false
  phie_soft: false
  phis_c_soft: false

checkpoint_selection:
  use_voltage_metrics: true
  use_physics_metrics: true
  use_no_drift_metrics: true
  use_state_softlabel_metrics: false
  use_frozen_test_metrics: false

audit:
  no_state_label_training: true
  split_manifest_locked: true
  no_oracle_theta0: true
  no_test_feedback: true
  battery8_policy: flagged_probe
